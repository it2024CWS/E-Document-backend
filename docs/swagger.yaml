basePath: /api
definitions:
  e-document-backend_internal_domain.ApproveDocumentRequest:
    properties:
      approver_id:
        type: string
      remark:
        type: string
      status:
        type: string
    type: object
  e-document-backend_internal_domain.AuthResponse:
    properties:
      accessToken:
        description: For mobile apps
        type: string
      refreshToken:
        description: For mobile apps
        type: string
      user:
        $ref: '#/definitions/e-document-backend_internal_domain.UserResponse'
    type: object
  e-document-backend_internal_domain.CreateDepartmentRequest:
    properties:
      dept_name:
        type: string
      description:
        type: string
    required:
    - dept_name
    type: object
  e-document-backend_internal_domain.CreateDocTypeRequest:
    properties:
      description:
        type: string
      type_name:
        type: string
    required:
    - type_name
    type: object
  e-document-backend_internal_domain.CreateDocumentRequest:
    properties:
      department_ids:
        items:
          type: string
        type: array
      description:
        type: string
      doc_name:
        description: Added form tag
        type: string
      doc_path:
        description: Not from form directly, set by handler
        type: string
      doc_type_id:
        type: string
      folder_id:
        type: string
      send_to_director:
        type: boolean
    required:
    - doc_name
    type: object
  e-document-backend_internal_domain.CreateFolderRequest:
    properties:
      folder_name:
        type: string
      folder_path:
        type: string
      parent_folder_id:
        type: string
    required:
    - folder_name
    - folder_path
    type: object
  e-document-backend_internal_domain.CreateOutgoingDocRequest:
    properties:
      doc_id:
        type: string
      user_id:
        type: string
    required:
    - doc_id
    type: object
  e-document-backend_internal_domain.CreateRoleRequest:
    properties:
      description:
        type: string
      role_name:
        type: string
    required:
    - role_name
    type: object
  e-document-backend_internal_domain.CreateSectorRequest:
    properties:
      dept_id:
        type: string
      name:
        type: string
    required:
    - dept_id
    - name
    type: object
  e-document-backend_internal_domain.DepartmentApprovalStatus:
    properties:
      approved:
        type: boolean
      approved_date:
        type: string
      department_id:
        type: string
      department_name:
        type: string
      received:
        type: boolean
      received_date:
        type: string
    type: object
  e-document-backend_internal_domain.DepartmentResponse:
    properties:
      created_at:
        type: string
      dept_name:
        type: string
      description:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  e-document-backend_internal_domain.DocTypeResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      type_name:
        type: string
      updated_at:
        type: string
    type: object
  e-document-backend_internal_domain.DocumentResponse:
    properties:
      approval_status:
        items:
          $ref: '#/definitions/e-document-backend_internal_domain.DepartmentApprovalStatus'
        type: array
      created_at:
        type: string
      department_name:
        type: string
      description:
        type: string
      doc_name:
        type: string
      doc_no:
        type: string
      doc_path:
        type: string
      doc_type_id:
        type: string
      doc_type_name:
        type: string
      folder_id:
        type: string
      folder_name:
        type: string
      id:
        type: string
      registrant_email:
        type: string
      registrant_id:
        type: string
      registrant_name:
        type: string
      sector_name:
        type: string
      send_to_director:
        type: boolean
      status:
        $ref: '#/definitions/e-document-backend_internal_domain.DocumentStatus'
      type:
        type: string
      updated_at:
        type: string
      version_number:
        type: integer
    type: object
  e-document-backend_internal_domain.DocumentStatus:
    enum:
    - none
    - pending
    - waiting_approval
    - approved
    type: string
    x-enum-varnames:
    - StatusNone
    - StatusPending
    - StatusWaitingApproval
    - StatusApproved
  e-document-backend_internal_domain.FolderResponse:
    properties:
      created_at:
        type: string
      folder_name:
        type: string
      folder_path:
        type: string
      id:
        type: string
      parent_folder_id:
        type: string
      user_id:
        type: string
    type: object
  e-document-backend_internal_domain.IncomingDocResponse:
    properties:
      approver_date:
        type: string
      approver_id:
        type: string
      approver_name:
        type: string
      created_at:
        type: string
      dept_id:
        type: string
      doc_id:
        type: string
      doc_name:
        type: string
      doc_no:
        type: string
      id:
        type: string
      incoming_no:
        type: string
      received_date:
        type: string
      receiver_id:
        type: string
      receiver_name:
        type: string
      remark:
        type: string
      sender_id:
        type: string
      sender_name:
        type: string
      status:
        $ref: '#/definitions/e-document-backend_internal_domain.IncomingDocStatus'
    type: object
  e-document-backend_internal_domain.IncomingDocStatus:
    enum:
    - pending
    - received
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - IncomingStatusPending
    - IncomingStatusReceived
    - IncomingStatusApproved
    - IncomingStatusRejected
  e-document-backend_internal_domain.LoginRequest:
    properties:
      password:
        type: string
      usernameOrEmail:
        type: string
    required:
    - password
    - usernameOrEmail
    type: object
  e-document-backend_internal_domain.OutgoingDocResponse:
    properties:
      created_at:
        type: string
      dept_id:
        type: string
      doc_id:
        type: string
      doc_name:
        type: string
      doc_no:
        type: string
      id:
        type: string
      incoming_docs:
        items:
          $ref: '#/definitions/e-document-backend_internal_domain.IncomingDocResponse'
        type: array
      outgoing_no:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  e-document-backend_internal_domain.ReceiveIncomingDocRequest:
    properties:
      remark:
        type: string
    type: object
  e-document-backend_internal_domain.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  e-document-backend_internal_domain.RoleResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      role_name:
        type: string
      updated_at:
        type: string
    type: object
  e-document-backend_internal_domain.SectorResponse:
    properties:
      created_at:
        type: string
      dept_id:
        type: string
      dept_name:
        description: Joined from departments table
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  e-document-backend_internal_domain.SendDocumentRequest:
    properties:
      receiver_id:
        description: Can be User UUID or Department ID (if implementing logic for
          that)
        type: string
      receiver_type:
        description: '"user" or "department"'
        type: string
      remark:
        type: string
    type: object
  e-document-backend_internal_domain.UpdateDepartmentRequest:
    properties:
      dept_name:
        type: string
      description:
        type: string
    type: object
  e-document-backend_internal_domain.UpdateDocTypeRequest:
    properties:
      description:
        type: string
      type_name:
        type: string
    type: object
  e-document-backend_internal_domain.UpdateDocumentRequest:
    properties:
      department_ids:
        items:
          type: string
        type: array
      description:
        type: string
      doc_name:
        type: string
      doc_path:
        description: Not from form directly, set by handler
        type: string
      doc_type_id:
        type: string
      folder_id:
        type: string
      send_to_director:
        type: boolean
    type: object
  e-document-backend_internal_domain.UpdateRoleRequest:
    properties:
      description:
        type: string
      role_name:
        type: string
    type: object
  e-document-backend_internal_domain.UpdateSectorRequest:
    properties:
      dept_id:
        type: string
      name:
        type: string
    type: object
  e-document-backend_internal_domain.UserResponse:
    properties:
      created_at:
        type: string
      department_id:
        type: string
      department_name:
        description: Joined from departments table
        type: string
      email:
        type: string
      firstname:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      lastname:
        type: string
      nickname:
        type: string
      phone:
        type: string
      profile_picture:
        type: string
      role_id:
        type: string
      role_name:
        description: Joined from user_roles table
        type: string
      sector_id:
        type: string
      sector_name:
        description: Joined from sectors table
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  e-document-backend_internal_domain.VersionResponse:
    properties:
      created_at:
        type: string
      doc_id:
        type: string
      doc_path:
        type: string
      folder_id:
        type: string
      id:
        type: string
      version_number:
        type: integer
    type: object
  e-document-backend_internal_util.ErrorCode:
    enum:
    - UNAUTHORIZED
    - INCORRECT_PASSWORD
    - INVALID_CREDENTIALS
    - TOKEN_EXPIRED
    - INVALID_TOKEN
    - FORBIDDEN
    - VALIDATION_ERROR
    - MISSING_REQUIRED_FIELD
    - INVALID_INPUT
    - INTERNAL_SERVER_ERROR
    - DATABASE_ERROR
    - CONFIG_NOT_SET
    - USER_NOT_FOUND
    - USER_ALREADY_EXISTS
    - EMAIL_ALREADY_EXISTS
    - ROLE_NOT_FOUND
    - ROLE_ALREADY_EXISTS
    type: string
    x-enum-varnames:
    - UNAUTHORIZED
    - INCORRECT_PASSWORD
    - INVALID_CREDENTIALS
    - TOKEN_EXPIRED
    - INVALID_TOKEN
    - FORBIDDEN
    - VALIDATION_ERROR
    - MISSING_REQUIRED_FIELD
    - INVALID_INPUT
    - INTERNAL_SERVER_ERROR
    - DATABASE_ERROR
    - CONFIG_NOT_SET
    - USER_NOT_FOUND
    - USER_ALREADY_EXISTS
    - EMAIL_ALREADY_EXISTS
    - ROLE_NOT_FOUND
    - ROLE_ALREADY_EXISTS
  e-document-backend_internal_util.PaginatedData:
    properties:
      items: {}
    type: object
  e-document-backend_internal_util.PaginationInfo:
    properties:
      currentPage:
        type: integer
      itemsPerPage:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  e-document-backend_internal_util.Response:
    properties:
      data: {}
      error_code:
        $ref: '#/definitions/e-document-backend_internal_util.ErrorCode'
      message:
        type: string
      pagination:
        $ref: '#/definitions/e-document-backend_internal_util.PaginationInfo'
      success:
        type: boolean
    type: object
  internal_app_file.GetPresignedURLResponse:
    properties:
      expires_in:
        description: seconds
        type: integer
      url:
        type: string
    type: object
  internal_app_upload.UploadInfoResponse:
    properties:
      extensions:
        example:
        - creation
        - creation-defer-length
        - termination
        - concatenation
        items:
          type: string
        type: array
      max_size:
        example: 0
        type: integer
      tus_version:
        example: 1.0.0
        type: string
      upload_path:
        example: /api/v1/upload/files
        type: string
    type: object
host: localhost:5001
info:
  contact:
    email: support@edocument.com
    name: API Support
  description: API for E-Document Management System
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: E-Document API
  version: "1.0"
paths:
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticate user with username/email and password. Always sets
        httpOnly cookies. Returns tokens in response body ONLY for mobile clients
        (when X-Client-Type: mobile header is present)'
      parameters:
      - description: Client type (use 'mobile' for mobile apps)
        in: header
        name: X-Client-Type
        type: string
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/e-document-backend_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  $ref: '#/definitions/e-document-backend_internal_domain.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      summary: User login
      tags:
      - Auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Clear authentication cookies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      summary: Logout user
      tags:
      - Auth
  /v1/auth/profile:
    get:
      consumes:
      - application/json
      description: Get authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  $ref: '#/definitions/e-document-backend_internal_domain.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Get new access and refresh tokens using a valid refresh token.
        Accepts token from body or cookie. Always sets httpOnly cookies. Returns tokens
        in response body ONLY for mobile clients (when X-Client-Type: mobile header
        is present)'
      parameters:
      - description: Client type (use 'mobile' for mobile apps)
        in: header
        name: X-Client-Type
        type: string
      - description: Refresh token (optional if using cookie)
        in: body
        name: body
        schema:
          $ref: '#/definitions/e-document-backend_internal_domain.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  $ref: '#/definitions/e-document-backend_internal_domain.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      summary: Refresh access token
      tags:
      - Auth
  /v1/departments:
    get:
      consumes:
      - application/json
      description: Get all departments with pagination and search
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by department name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/e-document-backend_internal_domain.DepartmentResponse'
                  type: array
                pagination:
                  $ref: '#/definitions/e-document-backend_internal_util.PaginationInfo'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Get all departments
      tags:
      - departments
    post:
      consumes:
      - application/json
      description: Create a new department
      parameters:
      - description: Department data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/e-document-backend_internal_domain.CreateDepartmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  $ref: '#/definitions/e-document-backend_internal_domain.DepartmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Create a new department
      tags:
      - Departments
  /v1/departments/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a department by its ID
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Delete department
      tags:
      - departments
    get:
      consumes:
      - application/json
      description: Get a single department by its ID
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  $ref: '#/definitions/e-document-backend_internal_domain.DepartmentResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Get department by ID
      tags:
      - departments
    put:
      consumes:
      - application/json
      description: Update a department by its ID
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      - description: Update department data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/e-document-backend_internal_domain.UpdateDepartmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  $ref: '#/definitions/e-document-backend_internal_domain.DepartmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Update department
      tags:
      - departments
  /v1/doctypes:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search by type name
        in: query
        name: search
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  $ref: '#/definitions/e-document-backend_internal_util.PaginatedData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Get all document types
      tags:
      - DocTypes
    post:
      consumes:
      - application/json
      description: Create a new document type
      parameters:
      - description: DocType data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/e-document-backend_internal_domain.CreateDocTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
            - properties:
                data:
                  $ref: '#/definitions/e-document-backend_internal_domain.DocTypeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Create a new document type
      tags:
      - DocTypes
  /v1/doctypes/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a document type
      parameters:
      - description: DocType ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/e-document-backend_internal_util.Response'
      security:
      - BearerAuth: []
      summary: Delete document type
      tags:
      - DocTypes
    get:
      consumes:
      - application/json
      description: Get detailed information of a specific document type
      parameters:
      - description: DocType ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/e-document-backend_internal_util.Response'
